name: Deploy to IONOS (SFTP)

# Static site, no build step. Uploads the site files to IONOS via SFTP.
# Existing files on the server are never deleted.
#
# Required repository settings (Settings > Secrets and variables > Actions):
#   Secrets:   IONOS_SFTP_HOST, IONOS_SFTP_USERNAME, IONOS_SFTP_PASSWORD
#   Variable:  IONOS_REMOTE_PATH  (absolute path of the site folder inside the SFTP root, e.g. /join)
# Without them the job only prints a warning and does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be uploaded"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'viktor-wilhelm/join'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        id: config
        env:
          HAS_HOST: ${{ secrets.IONOS_SFTP_HOST != '' }}
          HAS_USERNAME: ${{ secrets.IONOS_SFTP_USERNAME != '' }}
          HAS_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD != '' }}
          REMOTE_PATH: ${{ vars.IONOS_REMOTE_PATH }}
        run: |
          if [ "$HAS_HOST" != "true" ] || [ "$HAS_USERNAME" != "true" ] || [ "$HAS_PASSWORD" != "true" ] || [ -z "$REMOTE_PATH" ]; then
            echo "::warning title=IONOS deployment skipped::SFTP secrets or IONOS_REMOTE_PATH are not configured."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]] || [[ "$REMOTE_PATH" == *..* ]]; then
            echo "::error title=Invalid IONOS_REMOTE_PATH::Use an absolute path such as /join without spaces or '..'."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "remote_dir=${REMOTE_PATH%/}/" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Collect site files
        if: steps.config.outputs.ready == 'true'
        run: |
          mkdir deploy
          cp -r index.html style.css assets config html scripts styles deploy/
          for file in index.html config/firebase.config.js html/summary.html scripts/dataStore.js; do
            test -f "deploy/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          find deploy -type f | wc -l

      - name: Upload to IONOS via SFTP
        if: steps.config.outputs.ready == 'true'
        uses: Dylan700/sftp-upload-action@f90db607d9fe1acdc0eefccee84d37c119b268fe # v1.1.4
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          uploads: |
            ./deploy/ => ${{ steps.config.outputs.remote_dir }}
          ignore: |
            **/.DS_Store
          delete: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
